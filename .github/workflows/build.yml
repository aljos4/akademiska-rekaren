name: Build Rekaren

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m PyInstaller --onefile --windowed --name Rekaren --icon=rekaren.ico rekaren.py
      - uses: actions/upload-artifact@v4
        with:
          name: Rekaren-Windows
          path: dist/Rekaren.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller
      - name: Build universal2
        run: python -m PyInstaller --onefile --windowed --name Rekaren --target-arch universal2 rekaren.py
      - name: Create DMG
        run: hdiutil create -volname "Rekaren" -srcfolder dist/Rekaren.app -ov -format UDZO Rekaren.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Rekaren-macOS
          path: Rekaren.dmg
