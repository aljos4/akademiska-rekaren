name: Build Rekaren

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Rekaren-Windows
            output_path: dist/Rekaren.exe
          - os: macos-latest
            artifact_name: Rekaren-macOS
            output_path: Rekaren.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        run: python -m PyInstaller --onefile --windowed --name Rekaren --icon=rekaren.ico rekaren.py

      - name: Build app (macOS - universal2)
        if: matrix.os == 'macos-latest'
        run: |
          python -m PyInstaller --onefile --windowed --name Rekaren rekaren.py
          # Skapa universal binary manuellt
          lipo -info dist/Rekaren.app/Contents/MacOS/Rekaren

      - name: Package macOS .app into .dmg
        if: matrix.os == 'macos-latest'
        run: |
          hdiutil create -volname "Rekaren" -srcfolder dist/Rekaren.app -ov -format UDZO Rekaren.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}
